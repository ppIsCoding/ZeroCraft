                - generic [ref=f33e281]: "/* 全局重置 + 字体 + 颜色基调 */ * { margin: 0; padding: 0; box-sizing: border-box; } body { background: #f5f7fa; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1e293b; padding: 2rem 1.5rem; } /* 博客容器：限制最大宽度，居中 */ .blog { max-width: 1100px; margin: 0 auto; } /* 头部区域：标题 + 导航 flex 布局 */ .blog-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid #e2e8f0; } .logo { font-size: 1.8rem; font-weight: 600; letter-spacing: -0.02em; color: #0f172a; } .logo span { color: #3b82f6; } .nav-links { display: flex; gap: 2rem; font-weight: 500; } .nav-links a { text-decoration: none; color: #475569; transition: color 0.2s; } .nav-links a:hover { color: #3b82f6; } /* 文章卡片网格区域 */ .post-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; margin-top: 1.5rem; } /* 卡片本身 */ .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03), 0 4px 8px rgba(0, 0, 0, 0.02); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; } .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -8px rgba(0, 0, 0, 0.1); } .card-image { width: 100%; height: 180px; object-fit: cover; display: block; } .card-content { padding: 1.5rem 1.25rem 1.75rem; flex: 1; display: flex; flex-direction: column; } .card h3 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.5rem; color: #0f172a; } .card .meta { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; margin-bottom: 0.8rem; } .card p { color: #334155; font-size: 0.95rem; margin-bottom: 1.25rem; flex: 1; } .read-more { align-self: flex-start; font-size: 0.9rem; font-weight: 500; color: #3b82f6; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; } .read-more:hover { border-bottom-color: #3b82f6; } /* 简单页脚 */ .blog-footer { margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0; text-align: center; color: #64748b; font-size: 0.9rem; } /* 移动端微调 */ @media (max-width: 640px) { .blog-header { flex-direction: column; align-items: flex-start; gap: 0.8rem; } .nav-links { gap: 1.25rem; } .logo { font-size: 1.6rem; } .post-grid { gap: 1.5rem; } }"
