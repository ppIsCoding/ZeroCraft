-bottom-color: #3b82f6; } /* 简单页脚 */ .blog-footer { margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0; text-align: center; color: #64748b; font-size: 0.9rem; } /* 移动端微调 */ @media (max-width: 640px) { .blog-header { flex-direction: column; align-items: flex-start; gap: 0.8rem; } .nav-links { gap: 1.25rem; } .logo { font-size: 1.6rem; } .post-grid { gap: 1.5rem; } }"
