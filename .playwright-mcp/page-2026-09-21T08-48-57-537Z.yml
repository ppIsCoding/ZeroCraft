                - paragraph [ref=f45e127]: "[工具调用] 写入文件 src/styles/main.css"
                - code [ref=f45e129]: ":root { --bg: #f7f8fa; --surface: #ffffff; --text: #1f2430; --muted: #6b7280; --primary: #3b82f6; --primary-dark: #2563eb; --border: #e8eaef; --radius: 14px; --shadow: 0 6px 24px rgba(24, 32, 56, 0.06); } * { box-sizing: border-box; } html, body { margin: 0; padding: 0; } body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; line-height: 1.7; -webkit-font-smoothing: antialiased; } a { color: inherit; text-decoration: none; } img { display: block; max-width: 100%; } .container { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 20px; } .section-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; } .section-sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; } .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 999px; background: var(--primary); color: #fff; font-size: 14px; cursor: pointer; transition: background 0.2s; } .btn:hover { background: var(--primary-dark); } .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); } .btn-ghost:hover { background: #eef1f6; } .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #eaf1ff; color: var(--primary-dark); font-size: 12px; } @media (max-width: 640px) { .section-title { font-size: 19px; } }"
                - paragraph [ref=f45e130]: "[工具调用] 写入文件 src/App.vue"
                - code [ref=f45e132]: "<script setup> import NavBar from '@/components/NavBar.vue' </script> <template> <div class=\"app\"> <NavBar /> <main class=\"main\"> <router-view /> </main> <footer class=\"footer\"> <div class=\"container\"> <p>青柠笔记 · 记录代码与生活的日常</p> <p class=\"copy\">© 2024 林清和 保留所有权利</p> </div> </footer> </div> </template> <style scoped> .app { display: flex; flex-direction: column; min-height: 100vh; } .main { flex: 1; padding: 32px 0 56px; } .footer { border-top: 1px solid var(--border); background: var(--surface); padding: 26px 0; text-align: center; color: var(--muted); font-size: 14px; } .footer p { margin: 2px 0; } .copy { font-size: 12px; color: #9aa3b2; } </style>"
                - paragraph [ref=f45e133]: "[工具调用] 写入文件 src/components/NavBar.vue"
                - code [ref=f45e135]: "<script setup> import { ref } from 'vue' const links = [ { to: '/', label: '首页' }, { to: '/posts', label: '文章' }, { to: '/about', label: '关于' } ] const open = ref(false) </script> <template> <header class=\"nav\"> <div class=\"container nav-inner\"> <router-link to=\"/\" class=\"brand\" @click=\"open = false\"> <span class=\"logo\">青</span> <span class=\"name\">青柠笔记</span> </router-link> <nav class=\"links\" :class=\"{ show: open }\"> <router-link v-for=\"l in links\" :key=\"l.to\" :to=\"l.to\" class=\"link\" @click=\"open = false\" > {{ l.label }} </router-link> </nav> <button class=\"menu\" @click=\"open = !open\" aria-label=\"菜单\"> <span></span><span></span><span></span> </button> </div> </header> </template> <style scoped> .nav { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); } .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; } .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; } .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #3b82f6, #22c55e); color: #fff; display: grid; place-items: center; font-size: 15px; } .name { font-size: 17px; } .links { display: flex; gap: 6px; } .link { padding: 8px 14px; border-radius: 999px; color: var(--muted); font-size: 15px; transition: all 0.2s; } .link:hover { color: var(--text); background: #eef1f6; } .link.router-link-exact-active { color: var(--primary-dark); background: #eaf1ff; } .menu { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; } .menu span { width: 20px; height: 2px; background: var(--text); border-radius: 2px; } @media (max-width: 640px) { .menu { display: flex; } .links { position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px 16px; display: none; } .links.show { display: flex; } } </style>"
                - paragraph [ref=f45e136]: "[工具调用] 写入文件 src/components/PostCard.vue"
                - code [ref=f45e138]: "<script setup> defineProps({ post: { type: Object, required: true } }) </script> <template> <article class=\"card\"> <router-link :to=\"`/posts/${post.id}`\" class=\"cover\"> <img :src=\"post.cover\" :alt=\"post.title\" loading=\"lazy\" /> <span class=\"tag cover-tag\">{{ post.category }}</span> </router-link> <div class=\"body\"> <div class=\"meta\">{{ post.date }} · {{ post.author }}</div> <h3 class=\"title\"> <router-link :to=\"`/posts/${post.id}`\">{{ post.title }}</router-link> </h3> <p class=\"summary\">{{ post.summary }}</p> <router-link :to=\"`/posts/${post.id}`\" class=\"more\">阅读全文 →</router-link> </div> </article> </template> <style scoped> .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; } .card:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(24, 32, 56, 0.1); } .cover { position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden; background: #eef1f6; } .cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; } .card:hover .cover img { transform: scale(1.05); } .cover-tag { position: absolute; top: 12px; left: 12px; background: rgba(255, 255, 255, 0.92); } .body { padding: 18px; display: flex; flex-direction: column; flex: 1; } .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; } .title { font-size: 17px; margin: 0 0 8px; line-height: 1.45; } .title:hover { color: var(--primary-dark); } .summary { font-size: 14px; color: var(--muted); margin: 0 0 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; } .more { margin-top: auto; font-size: 14px; color: var(--primary-dark); font-weight: 500; } </style>"
                - paragraph [ref=f45e139]: "[工具调用] 写入文件 src/pages/Home.vue"
                - code [ref=f45e141]: "<script setup> import { computed } from 'vue' import PostCard from '@/components/PostCard.vue' import { posts, categories } from '@/utils/posts' const featured = computed(() => posts[0]) const latest = computed(() => posts.slice(1, 4)) const stats = [ { num: posts.length, label: '篇文章' }, { num: categories.length - 1, label: '个分类' }, { num: 3, label: '年坚持' } ] </script> <template> <div class=\"container\"> <section class=\"hero\"> <div class=\"hero-text\"> <p class=\"hello\">你好，我是林清和 👋</p> <h1>在这里，记录代码与生活的日常</h1> <p class=\"desc\"> 一名前端工程师，喜欢把复杂的事情讲简单。这个博客收录了我关于技术、效率与生活的一些思考，希望能给你带来一点启发。 </p> <div class=\"actions\"> <router-link to=\"/posts\" class=\"btn\">浏览全部文章</router-link> <router-link to=\"/about\" class=\"btn btn-ghost\">了解我</router-link> </div> </div> <div class=\"hero-img\"> <img src=\"https://picsum.photos/seed/limehero/640/640\" alt=\"博客配图\" /> </div> </section> <section class=\"stats\"> <div v-for=\"s in stats\" :key=\"s.label\" class=\"stat\"> <div class=\"num\">{{ s.num }}</div> <div class=\"label\">{{ s.label }}</div> </div> </section> <section class=\"block\"> <h2 class=\"section-title\">精选文章</h2> <p class=\"section-sub\">值得慢慢读的一篇</p> <div class=\"featured\"> <router-link :to=\"`/posts/${featured.id}`\" class=\"feat-img\"> <img :src=\"featured.cover\" :alt=\"featured.title\" /> </router-link> <div class=\"feat-body\"> <span class=\"tag\">{{ featured.category }}</span> <h3> <router-link :to=\"`/posts/${featured.id}`\">{{ featured.title }}</router-link> </h3> <p>{{ featured.summary }}</p> <div class=\"meta\">{{ featured.date }} · {{ featured.author }}</div> <router-link :to=\"`/posts/${featured.id}`\" class=\"btn\">继续阅读</router-link> </div> </div> </section> <section class=\"block\"> <h2 class=\"section-title\">最新更新</h2> <p class=\"section-sub\">最近写下的几篇</p> <div class=\"grid\"> <PostCard v-for=\"p in latest\" :key=\"p.id\" :post=\"p\" /> </div> </section> <section class=\"cta\"> <h2>不想错过新文章？</h2> <p>每两周写一次，只分享真正想清楚的事。</p> <router-link to=\"/posts\" class=\"btn\">进入文章列表</router-link> </section> </div> </template> <style scoped> .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 48px; box-shadow: var(--shadow); } .hello { color: var(--primary-dark); font-size: 15px; margin: 0 0 10px; } .hero h1 { font-size: 34px; line-height: 1.35; margin: 0 0 16px; } .desc { color: var(--muted); font-size: 15.5px; margin: 0 0 26px; } .actions { display: flex; gap: 12px; flex-wrap: wrap; } .hero-img img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px; } .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 26px 0 48px; } .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; text-align: center; } .num { font-size: 26px; font-weight: 700; color: var(--primary-dark); } .label { color: var(--muted); font-size: 14px; } .block { margin-bottom: 52px; } .featured { display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); } .feat-img img { width: 100%; height: 100%; min-height: 260px; object-fit: cover; } .feat-body { padding: 30px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; } .feat-body h3 { font-size: 22px; margin: 0; line-height: 1.4; } .feat-body h3:hover { color: var(--primary-dark); } .feat-body p { color: var(--muted); font-size: 14.5px; margin: 0; } .meta { font-size: 13px; color: #9aa3b2; } .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; } .cta { text-align: center; background: linear-gradient(135deg, #eef4ff, #eafaf0); border-radius: 20px; padding: 44px 24px; } .cta h2 { margin: 0 0 6px; font-size: 22px; } .cta p { color: var(--muted); margin: 0 0 20px; } @media (max-width: 900px) { .hero { grid-template-columns: 1fr; padding: 32px; } .hero-img img { aspect-ratio: 16 / 9; } .featured { grid-template-columns: 1fr; } .grid { grid-template-columns: repeat(2, 1fr); } } @media (max-width: 640px) { .hero h1 { font-size: 25px; } .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr; gap: 14px; } } </style>"
                - paragraph [ref=f45e142]: "[工具调用] 写入文件 src/pages/Posts.vue"
                - code [ref=f45e144]: "<script setup> import { ref, computed } from 'vue' import PostCard from '@/components/PostCard.vue' import { posts, categories } from '@/utils/posts' const active = ref('全部') const keyword = ref('') const filtered = computed(() => posts.filter((p) => { const matchCat = active.value === '全部' || p.category === active.value const matchKey = keyword.value.trim() === '' || p.title.includes(keyword.value.trim()) || p.summary.includes(keyword.value.trim()) return matchCat && matchKey }) ) </script> <template> <div class=\"container\"> <header class=\"page-head\"> <h1 class=\"section-title\">全部文章</h1> <p class=\"section-sub\">共 {{ filtered.length }} 篇 · 按时间倒序排列</p> </header> <div class=\"toolbar\"> <div class=\"cats\"> <button v-for=\"c in categories\" :key=\"c\" class=\"cat\" :class=\"{ active: active === c }\" @click=\"active = c\" > {{ c }} </button> </div> <input v-model=\"keyword\" class=\"search\" type=\"search\" placeholder=\"搜索文章标题或摘要…\" /> </div> <div v-if=\"filtered.length\" class=\"grid\"> <PostCard v-for=\"p in filtered\" :key=\"p.id\" :post=\"p\" /> </div> <p v-else class=\"empty\">没有找到匹配的文章，试试换个关键词吧。</p> </div> </template> <style scoped> .page-head { margin-bottom: 20px; } .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; } .cats { display: flex; gap: 8px; flex-wrap: wrap; } .cat { padding: 7px 15px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 14px; cursor: pointer; transition: all 0.2s; } .cat:hover { color: var(--text); } .cat.active { background: var(--primary); border-color: var(--primary); color: #fff; } .search { flex: 1; min-width: 200px; max-width: 320px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; outline: none; } .search:focus { border-color: var(--primary); } .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; } .empty { text-align: center; color: var(--muted); padding: 60px 0; } @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } } @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .search { max-width: 100%; } } </style>"
                - paragraph [ref=f45e145]: "[工具调用] 写入文件 src/pages/PostDetail.vue"
                - code [ref=f45e147]: "<script setup> import { computed } from 'vue' import { useRoute, useRouter } from 'vue-router' import { getPostById, posts } from '@/utils/posts' const route = useRoute() const router = useRouter() const post = computed(() => getPostById(route.params.id)) const related = computed(() => posts.filter((p) => p.id !== Number(route.params.id)).slice(0, 2) ) </script> <template> <div class=\"container\"> <button class=\"back\" @click=\"router.back()\">← 返回</button> <article v-if=\"post\"> <header class=\"head\"> <span class=\"tag\">{{ post.category }}</span> <h1>{{ post.title }}</h1> <div class=\"meta\">{{ post.date }} · {{ post.author }}</div> </header> <img class=\"cover\" :src=\"post.cover\" :alt=\"post.title\" /> <div class=\"content\"> <p class=\"lead\">{{ post.summary }}</p> <p v-for=\"(para, i) in post.content\" :key=\"i\">{{ para }}</p> </div> <section class=\"related\"> <h2 class=\"section-title\">相关阅读</h2> <div class=\"rel-list\"> <router-link v-for=\"r in related\" :key=\"r.id\" :to=\"`/posts/${r.id}`\" class=\"rel-item\" > <img :src=\"r.cover\" :alt=\"r.title\" /> <div> <div class=\"rel-title\">{{ r.title }}</div> <div class=\"rel-date\">{{ r.date }}</div> </div> </router-link> </div> </section> </article> <div v-else class=\"notfound\"> <p>抱歉，这篇文章不存在或已被移除。</p> <router-link to=\"/posts\" class=\"btn\">返回文章列表</router-link> </div> </div> </template> <style scoped> .back { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 0; margin-bottom: 20px; } .back:hover { color: var(--primary-dark); } .head { max-width: 720px; margin: 0 auto 26px; text-align: center; } .head h1 { font-size: 30px; line-height: 1.4; margin: 14px 0 10px; } .meta { color: var(--muted); font-size: 13.5px; } .cover { width: 100%; max-width: 860px; margin: 0 auto 32px; aspect-ratio: 16 / 8; object-fit: cover; border-radius: var(--radius); } .content { max-width: 720px; margin: 0 auto; font-size: 16.5px; color: #333a48; } .content p { margin: 0 0 20px; } .lead { font-size: 17.5px; color: #4a5568; border-left: 3px solid var(--primary); padding-left: 16px; background: #f4f8ff; padding: 16px 18px; border-radius: 8px; } .related { max-width: 860px; margin: 52px auto 0; padding-top: 32px; border-top: 1px solid var(--border); } .rel-list { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; } .rel-item { display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; transition: transform 0.2s; } .rel-item:hover { transform: translateY(-3px); } .rel-item img { width: 88px; height: 66px; object-fit: cover; border-radius: 9px; flex-shrink: 0; } .rel-title { font-size: 14.5px; font-weight: 600; line-height: 1.45; margin-bottom: 6px; } .rel-date { font-size: 12.5px; color: var(--muted); } .notfound { text-align: center; padding: 80px 0; color: var(--muted); } .notfound p { margin-bottom: 20px; } @media (max-width: 640px) { .head h1 { font-size: 23px; } .rel-list { grid-template-columns: 1fr; } .cover { aspect-ratio: 16 / 10; } } </style>"
                - paragraph [ref=f45e148]: "[工具调用] 写入文件 src/pages/About.vue"
                - code [ref=f45e150]: "<script setup> const skills = [ { name: 'Vue 3 / 组合式 API', level: 92 }, { name: 'CSS 布局与响应式', level: 88 }, { name: '工程化与构建', level: 80 }, { name: 'Node.js 服务端', level: 72 } ] const timeline = [ { year: '2021', title: '入行前端', desc: '从写第一个页面开始，慢慢找到感觉。' }, { year: '2022', title: '深入构建工具', desc: '开始折腾 Vite 与模块化，理解工程化价值。' }, { year: '2023', title: '开始写博客', desc: '把想清楚的事写下来，倒逼自己复盘。' }, { year: '2024', title: '持续输出中', desc: '保持每两周一次的更新节奏。' } ] </script> <template> <div class=\"container\"> <section class=\"profile\"> <img class=\"avatar\" src=\"https://picsum.photos/seed/meavatar/300/300\" alt=\"头像\" /> <div> <h1>林清和</h1> <p class=\"role\">前端工程师 · 内容创作者</p> <p class=\"bio\"> 我喜欢把复杂的技术讲得简单一点，也喜欢在生活里找一些能慢下来的时刻。 这个博客是我把想法落成文字的地方，欢迎你随时来坐坐。 </p> <div class=\"contact\"> <span>📮 lime@example.com</span> <span>🌐 github.com/linqinghe</span> </div> </div> </section> <section class=\"block\"> <h2 class=\"section-title\">技能概览</h2> <p class=\"section-sub\">一路走来积累的一些方向</p> <div class=\"skill-list\"> <div v-for=\"s in skills\" :key=\"s.name\" class=\"skill\"> <div class=\"skill-head\"> <span>{{ s.name }}</span> <span class=\"pct\">{{ s.level }}%</span> </div> <div class=\"bar\"><div class=\"fill\" :style=\"{ width: s.level + '%' }\"></div></div> </div> </div> </section> <section class=\"block\"> <h2 class=\"section-title\">我的经历</h2> <p class=\"section-sub\">几个重要的节点</p> <ul class=\"timeline\"> <li v-for=\"t in timeline\" :key=\"t.year\"> <div class=\"year\">{{ t.year }}</div> <div class=\"tl-body\"> <div class=\"tl-title\">{{ t.title }}</div> <div class=\"tl-desc\">{{ t.desc }}</div> </div> </li> </ul> </section> </div> </template> <style scoped> .profile { display: grid; grid-template-columns: 180px 1fr; gap: 32px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px; box-shadow: var(--shadow); } .avatar { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; } .profile h1 { margin: 0 0 4px; font-size: 28px; } .role { color: var(--primary-dark); font-size: 15px; margin: 0 0 14px; } .bio { color: var(--muted); font-size: 15px; margin: 0 0 18px; } .contact { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; color: #4a5568; } .block { margin-top: 48px; } .skill-list { display: grid; gap: 18px; } .skill-head { display: flex; justify-content: space-between; font-size: 14.5px; margin-bottom: 8px; } .pct { color: var(--muted); } .bar { height: 9px; background: #e8eaef; border-radius: 999px; overflow: hidden; } .fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #22c55e); border-radius: 999px; } .timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--border); } .timeline li { display: flex; gap: 20px; padding: 0 0 26px 24px; position: relative; } .timeline li::before { content: ''; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 2px solid #fff; } .year { font-weight: 700; color: var(--primary-dark); width: 52px; flex-shrink: 0; } .tl-title { font-weight: 600; margin-bottom: 4px; } .tl-desc { color: var(--muted); font-size: 14px; } @media (max-width: 640px) { .profile { grid-template-columns: 1fr; text-align: center; padding: 28px; } .avatar { margin: 0 auto; width: 130px; height: 130px; } .contact { justify-content: center; } .profile h1 { font-size: 23px; } } </style>"
