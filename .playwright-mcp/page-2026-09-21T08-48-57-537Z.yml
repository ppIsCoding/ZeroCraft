                - paragraph [ref=f45e116]: "[工具调用] 写入文件 src/main.js"
                - code [ref=f45e118]: "import { createApp } from 'vue' import App from './App.vue' import router from './router' import './styles/main.css' createApp(App).use(router).mount('#app')"
                - paragraph [ref=f45e119]: "[工具调用] 写入文件 src/router/index.js"
                - code [ref=f45e121]: "import { createRouter, createWebHashHistory } from 'vue-router' import Home from '@/pages/Home.vue' import Posts from '@/pages/Posts.vue' import PostDetail from '@/pages/PostDetail.vue' import About from '@/pages/About.vue' const routes = [ { path: '/', name: 'home', component: Home }, { path: '/posts', name: 'posts', component: Posts }, { path: '/posts/:id', name: 'post-detail', component: PostDetail }, { path: '/about', name: 'about', component: About } ] export default createRouter({ history: createWebHashHistory(), routes, scrollBehavior: () => ({ top: 0 }) })"
                - paragraph [ref=f45e122]: "[工具调用] 写入文件 src/utils/posts.js"
                - code [ref=f45e124]:
                  - text: "export const posts = [ { id: 1, title: '用 Vue3 组合式 API 重构旧项目的心得', category: '前端开发', date: '2024-05-18', author: '林清和', cover: 'https://picsum.photos/seed/vue3/800/500', summary: '从选项式到组合式的迁移并没有想象中那么难，真正的挑战在于重新思考状态的边界与逻辑的组织方式。', content: [ '刚开始接触组合式 API 时，我把所有逻辑都塞进一个 setup 里，结果比原来更乱。后来我发现，关键在于把「相关的状态和行为」聚合成一个可复用的函数。', '比如把「文章分页」这件事抽成 usePagination，把「请求封装」抽成 useRequest，组件里就只剩下渲染逻辑，读起来清爽很多。', '迁移不是一次性的重写，而是渐进式的演进。先从一个小组件开始，感受组合式带来的组织方式变化，再逐步推开，整个过程会顺畅得多。' ] }, { id: 2, title: '我的极简工作流：少即是多', category: '效率方法', date: '2024-05-06', author: '林清和', cover: 'https://picsum.photos/seed/workflow/800/500', summary: '工具越多，注意力越碎。我花了一个月精简自己的软件列表，最终只留下真正每天都会打开的那几个。', content: [ '过去我热衷于尝试各种新工具，待办清单装了三个，笔记软件换了五款。结果是每天花在「整理工具」上的时间比真正做事还多。', '现在的做法很简单：一个编辑器写代码，一个文本文件记待办，一个笔记应用存沉淀。够用就好，边界清晰。', '真正的效率不来自工具的强大，而来自流程的稳定。当你知道文件放在哪里、下一步该做什么，焦虑自然就少了。' ] }, { id: 3, title: '城市里的一杯手冲咖啡', category: '生活随笔', date: '2024-04-27', author: '林清和', cover: 'https://picsum.photos/seed/coffee/800/500', summary: '周末的清晨，阳光斜斜地落在木桌上，磨豆的声音像是给一天按下了开始键。', content: [ '我并不是一个懂咖啡的人，只是喜欢那套仪式感：称豆、磨粉、闷蒸、注水，每一步都不能太快。', '在快节奏的城市里，手冲咖啡是少数会「强制」慢下来的事。你得等，等水流过粉层，等香气一层层打开。', '或许我们需要的从来不是咖啡因，而是那段什么都不做、只专注在一杯水上的时间。' ] }, { id: 4, title: '重新学习 CSS 布局的三年', category: '前端开发', date: '2024-04-12', author: '林清和', cover: 'https://picsum.photos/seed/css-layout/800/500', summary: 'Flexbox 和 Grid 改变了我们写布局的方式，但真正难的是判断在什么场景该用哪一个。', content: [ 'Flexbox 擅长一维排布，Grid 擅长二维区域划分。以前的我会在两个里面纠结很久，现在的判断标准很直接：内容决定布局还是布局决定内容。', '响应式设计也一样，与其堆砌断点，不如先想清楚每个尺寸下用户最关心什么内容，再决定它该占多大位置。', '前端技术更新很快，但布局的内核其实很稳定：对齐、留白、层级、可读性。把这些打磨好，比追逐框架更重要。' ] }, { id: 5, title: '写给坚持写作的自己', category: '生活随笔', date: '2024-03-30', author: '林清和', cover: 'https://picsum.photos/seed/writing/800/500', summary: '写作最难的部分从来不是灵感，而是愿意坐下来面对空白页的那几分钟。', content: [ '这个博客断断续续写了三年，有过日更的热情，也有过几个月不更新的沉默。后来我明白了，更新频率不重要，持续这件事本身才重要。', '我开始允许自己写「不够好」的文章。先写出来，再慢慢改，总好过因为追求完美而永远不开始。', '如果你也有一件想坚持的事，别等准备好，现在就开始。哪怕只写一百字，也是一种前进。' ] }, { id: 6, title: '一份靠谱的接口设计清单', category: '后端漫谈', date: '2024-03-15', author: '林清和', cover: 'https://picsum.photos/seed/api/800/500', summary: '好的接口让对接的人不用反复确认，坏接口则让人写十封邮件都问不清楚。', content: [ '命名要一致：既然列表用了复数，详情也请保持复数。风格统一比风格本身是否完美更重要。', '状态码要严谨：别把所有错误都返回 200。前端需要知道是参数错了、没权限，还是服务端崩了。', '文档要随手更新：接口改了但文档没改，比没有文档更糟。把文档当成代码的一部分来维护。' ] } ] export const getPostById = (id) => posts.find("
